# Infrastructure for local development: MySQL (+ Liquibase schema init), Elasticsearch, Kibana.
# Usage: cp .env.example .env && docker compose up -d
name: restaurant-review

services:
  mysql:
    image: mysql:8.4
    container_name: rr-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_review}
      MYSQL_USER: ${MYSQL_USER:-rr_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rr_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs only when mysql_data is empty: creates the database and grants the app user
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rr-network

  # One-shot: applies the Liquibase changelog (the same files the app uses) once MySQL is healthy, then exits.
  liquibase:
    image: liquibase/liquibase:${LIQUIBASE_VERSION:-5.0.4}
    container_name: rr-liquibase
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    # The image ships without the (GPL) MySQL driver. Install it with lpm only if missing
    # (the image's INSTALL_MYSQL switch fails when the container is re-run), then use the stock entrypoint.
    entrypoint:
      - /bin/bash
      - -c
      - |
        ls /liquibase/lib/mysql-connector-*.jar > /dev/null 2>&1 || lpm add mysql --global
        exec /liquibase/docker-entrypoint.sh "$$@"
      - --
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-restaurant_review}?createDatabaseIfNotExist=true
      LIQUIBASE_COMMAND_USERNAME: ${MYSQL_USER:-rr_user}
      LIQUIBASE_COMMAND_PASSWORD: ${MYSQL_PASSWORD:-rr_pass}
      # Same relative path as the app's classpath, so both record identical changeset file names
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db/changelog/db.changelog-master.yaml
    volumes:
      - ./backend/src/main/resources/db:/liquibase/changelog/db:ro
    command: ["update"]
    networks:
      - rr-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-9.3.3}
    container_name: rr-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      # Dev only: security disabled so the API and Kibana connect without credentials.
      # Enable xpack security (TLS + passwords) for any shared or production environment.
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rr-network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-9.3.3}
    container_name: rr-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - rr-network

volumes:
  mysql_data:
  es_data:

networks:
  rr-network:
    driver: bridge
