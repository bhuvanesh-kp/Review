# Defaults match .env.example / docker-compose.yml so the app runs locally without extra setup.
spring:
  application:
    name: restaurant-review
  datasource:
    # createDatabaseIfNotExist: Connector/J creates the database on connect if it is missing
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurant_review?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:rr_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rr_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Required once JWT auth is implemented; no default on purpose.
    secret: ${JWT_SECRET:}
